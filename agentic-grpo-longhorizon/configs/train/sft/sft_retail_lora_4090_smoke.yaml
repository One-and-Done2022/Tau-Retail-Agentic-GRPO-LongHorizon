model:
  name_or_path: "../models/Qwen2.5-7B-Instruct"
  attn_impl: "sdpa"

data:
  train_jsonl: "experiments/retail_sft/collect_8k_tiny/train.jsonl"
  eval_jsonl: null
  max_length: 4096

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  num_epochs: 1
  max_steps: 1
  per_device_batch_size: 1
  grad_accum_steps: 1
  lr: 1.0e-4
  lr_scheduler: constant
  warmup_ratio: 0.0
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  save_strategy: "no"
  save_total_limit: 1
  run_name: "sft_retail_lora_4090_smoke"
  seed: 42

logger:
  backend: none

output:
  dir: "experiments/retail_sft/lora_smoke"
